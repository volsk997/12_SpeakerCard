type: custom:bubble-card
card_type: pop-up
hash: '#edifier'
show_header: false
close_by_clicking_outside: true
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Акустика
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: mdi:speaker
      - type: spacer
      - type: template
        entity: input_boolean.akustika
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-template-card
    entity: input_boolean.akustika
    tap_action:
      action: toggle
    hold_action:
      action: none
    double_tap_action:
      action: none
    icon: mdi:power
    color: |
      {% if is_state(entity, 'on') %} black
      {% else %}white{% endif %}
    features_position: bottom
    icon_tap_action:
      action: none
    vertical: true
    card_mod:
      style: |
        ha-card {
          background: {% if is_state(config.entity, 'on') %}rgba(255, 255, 255, 1){% else %}rgba(255, 255, 255, 0.1){% endif %} !important;
          zoom: 2;
        }
    grid_options:
      rows: auto
      columns: full
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: input_select.r1280db_source
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'M-Audio')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.edifier
          data:
            variables:
              command: line_1
        icon: mdi:audio-input-rca
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: input_select.r1280db_source
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'PC')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.edifier
          data:
            variables:
              command: line_2
        icon: fas:computer
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: input_select.r1280db_source
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'Bluetooth')%}  white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.edifier
          data:
            variables:
              command: bt
        icon: mdi:bluetooth
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: fit-content
card_layout: large
slide_to_close_distance: '500'
